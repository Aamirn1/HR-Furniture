<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HR Furniture monogram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8B36A"/>
      <stop offset="0.55" stop-color="#C88A5A"/>
      <stop offset="1" stop-color="#7A5230"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.75"/>

  <!-- "HR" monogram -->
  <text x="64" y="80" font-family="'Playfair Display', Georgia, serif" font-size="54" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">HR</text>

  <!-- Sofa cushion swoosh -->
  <path d="M38 96 Q64 108 90 96" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Small champagne dots -->
  <circle cx="56" cy="110" r="1.5" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="64" cy="110" r="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="72" cy="110" r="1.5" fill="#FFFFFF" fill-opacity="0.3"/>
</svg>
