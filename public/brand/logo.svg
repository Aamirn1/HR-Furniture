<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HR Furniture — Premium Sofas">
  <defs>
    <linearGradient id="hrMonogram" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8B36A"/>
      <stop offset="0.55" stop-color="#C88A5A"/>
      <stop offset="1" stop-color="#7A5230"/>
    </linearGradient>
    <linearGradient id="hrText" x1="0" y1="0" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E2A20"/>
      <stop offset="1" stop-color="#7A5230"/>
    </linearGradient>
  </defs>

  <!-- Monogram disc -->
  <circle cx="28" cy="28" r="26" fill="url(#hrMonogram)"/>
  <circle cx="28" cy="28" r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="28" cy="28" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.75"/>

  <!-- "HR" letters — slim, elegant serif -->
  <text x="28" y="36" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">HR</text>

  <!-- Decorative leaf / sofa cushion swoosh under monogram -->
  <path d="M16 40 Q28 46 40 40" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Brand wordmark -->
  <text x="68" y="27" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="url(#hrText)" letter-spacing="-0.3">HR Furniture</text>
  <text x="68" y="42" font-family="'Poppins', 'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#7A5230" letter-spacing="3" opacity="0.85">PREMIUM SOFAS</text>

  <!-- Tiny champagne dot after the wordmark for editorial flourish -->
  <circle cx="68" cy="48" r="1.2" fill="#D8B36A"/>
  <circle cx="74" cy="48" r="1.2" fill="#C88A5A"/>
  <circle cx="80" cy="48" r="1.2" fill="#7A5230"/>
</svg>
